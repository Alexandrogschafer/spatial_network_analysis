# Ambiente conda para o livro "Análise Espacial de Redes".
# Uso:
#   conda env create -f environment.yml
#   conda activate analise-espacial-redes
#   jupyter-book build .
# Mantenha este arquivo sincronizado com requirements.txt.
name: analise-espacial-redes
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyter-book>=1.0.2,<2
  - networkx>=3.2
  - osmnx>=2.0,<3
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - scikit-learn>=1.3
  - numpy>=1.26
  - pandas>=2.1
  - matplotlib>=3.8
  - mapclassify>=2.6
  - folium>=0.15
  - geopy>=2.4
  - unidecode>=1.3
